<!doctype html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MasteryLab AI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">🎓</span>
      <span>MasteryLab AI</span>
    </div>
  </header>

  <main class="container">
    <section class="upload-card">
      <div class="upload-icon">⇪</div>
      <h1>Puja el teu material d'estudi</h1>
      <p>Arrossega o selecciona un fitxer PDF, TXT o MD. Generarem un qüestionari personalitzat per ajudar-te a dominar el contingut.</p>

      <label class="file-picker" for="fileInput">Selecciona fitxer d'estudi</label>
      <input id="fileInput" type="file" />

      <label for="numQuestions">Nombre de preguntes</label>
      <input id="numQuestions" type="number" min="1" max="30" value="5" />

      <button id="startBtn" type="button">Generar test</button>
      <p id="configWarning" class="warning hidden">⚠️ Falta configuració del servidor (API key/model).</p>
      <div class="features">
        <span>◌ ADAPTATIU</span>
        <span>◌ SINCRONITZAT</span>
      </div>
    </section>

    <section id="quizSection" class="panel hidden">
      <h2 id="quizTitle">Qüestionari</h2>
      <form id="quizForm"></form>
      <div class="actions">
        <button id="submitBtn" type="button">Corregir</button>
      </div>
    </section>

    <section id="resultSection" class="panel hidden"></section>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
