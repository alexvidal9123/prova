<!doctype html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MasteryLab AI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">◍</span>
      <span class="brand-text">MasteryLab AI</span>
    </div>
    <div class="top-controls" aria-hidden="true">
      <div class="lang-pill">
        <span class="active">AD</span>
        <span>US</span>
        <span>ES</span>
      </div>
      <button class="globe-btn" type="button">◯</button>
    </div>
  </header>

  <main class="container">
    <section class="upload-card" id="dropArea" role="button" tabindex="0" aria-label="Puja material d'estudi">
      <div class="upload-icon">↥</div>
      <h1>Puja el teu material d'estudi</h1>
      <p>Arrossega el teu fitxer PDF o TXT aquí. Generarem<br />un qüestionari personalitzat per ajudar-te a<br />dominar el contingut.</p>

      <input id="fileInput" type="file" accept=".txt,.md,.pdf,.doc,.docx" />
      <p id="configWarning" class="warning hidden">⚠️ Falta configuració del servidor.</p>

      <div class="features">
        <span>◌ ADAPTATIU</span>
        <span>◌ SINCRONITZAT</span>
      </div>
    </section>

    <section id="quizSection" class="panel hidden">
      <h2 id="quizTitle">Qüestionari</h2>
      <form id="quizForm"></form>
      <div class="actions">
        <button id="submitBtn" type="button">Corregir</button>
      </div>
    </section>

    <section id="resultSection" class="panel hidden"></section>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
